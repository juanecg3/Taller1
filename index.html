<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cafetería</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- CABECERA -->
    <header>
        <div class="logo">
            <span class="logo-icon"></span>
            <span>Café</span>
        </div>

        <nav>
            <a href="#inicio">Inicio</a>
            <a href="#menu">Menú</a>
            <a href="#nosotros">Nosotros</a>
            <a href="#contacto">Contacto</a>
        </nav>
    </header>


    <main>

        <!-- HERO -->
        <section id="inicio" class="hero">
            <h1>Cafetería...</h1>
            <p>El mejor café para tu día</p>
            <a href="#menu" class="boton">Ver menú</a>
        </section>

        <!-- PRODUCTOS -->
        <section id="menu" class="productos">
            <h2>Nuestros productos</h2>

            <div class="tarjetas">

                <article class="tarjeta">
                    <div class="producto-icono"></div>
                    <h3>Café</h3>
                    <p>$2.50</p>
                </article>

                <article class="tarjeta">
                    <div class="producto-icono"></div>
                    <h3>Capuchino</h3>
                    <p>$3.00</p>
                </article>

                <article class="tarjeta">
                    <div class="producto-icono"></div>
                    <h3>Latte</h3>
                    <p>$3.50</p>
                </article>

                <article class="tarjeta">
                    <div class="producto-icono"></div>
                    <h3>Chocolate</h3>
                    <p>$4.00</p>
                </article>

            </div>
        </section>

        <!-- NOSOTROS -->
        <section id="nosotros" class="nosotros">

            <div class="historia">
                <h2>Nuestra historia</h2>
                <p>Todo empezó cierto día...</p>
            </div>

            <div class="imagen">
                <h2>Imagen</h2>
                <div class="imagen-placeholder"></div>
            </div>

        </section>

    </main>


    <!-- FOOTER -->
    <footer id="contacto">
        <p>© 2026 Cafetería...</p>
        <p>Instagram · Contacto</p>
    </footer>

</body>

</html>
